<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tallo, demo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="felles/skin.css">
<link rel="stylesheet" href="felles/ui.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); padding: 24px; }
  .kort { width: min(520px, 100%); padding: 32px; }
  .logo { font-weight: 800; letter-spacing: -.05em; font-size: 22px; margin-bottom: 18px; }
  h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -.03em; }
  .valg { display: grid; gap: 10px; margin-top: 20px; }
  .valg a { display: block; padding: 16px 18px; border-radius: 14px; text-decoration: none; color: inherit; box-shadow: inset 0 0 0 1px var(--lineal); }
  .valg a:hover { box-shadow: inset 0 0 0 2px var(--accent); }
  .valg b { display: block; font-size: 16px; } .valg small { color: var(--daempet); }
</style>
</head>
<body>
<main class="kort">
  <div class="logo">tallo</div>
  <h1>Prøv Tallo</h1>
  <p class="not">Et opdigtet bageri med et helt års bogføring. Alt, du ser, er rigtige tal fra vores program.</p>
  <div class="valg">
    <a href="app/"><b>Kundens app</b><small>Log ind med mette@bageriet-kornet.dk og koden demo-kode-1234.</small></a>
    <a href="bord/"><b>Bogholderens arbejdsbord</b><small>Kun for Tallo. Kræver kode og godkenderapp.</small></a>
  </div>
  <p class="not" style="font-size:13px;margin-top:18px">Tilbage til <a href="https://tallo.dk" style="color:var(--accent)">tallo.dk</a></p>
</main>
</body>
</html>
